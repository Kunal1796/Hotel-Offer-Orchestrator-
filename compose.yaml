name: hotel-offer-orchestrator

x-app: &app
  build: .
  image: hotel-offer-orchestrator:local
  restart: unless-stopped
  init: true
  environment: &environment
    PORT: 3000
    REDIS_URL: redis://redis:6379
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: default
    TEMPORAL_TASK_QUEUE: hotel-offers
    SUPPLIER_BASE_URL: http://api:3000
    SNAPSHOT_TTL_SECONDS: 300
    SUPPLIER_A_DOWN: ${SUPPLIER_A_DOWN:-false}
    SUPPLIER_B_DOWN: ${SUPPLIER_B_DOWN:-false}

services:
  redis:
    image: redis:7.4-bookworm
    command: [redis-server, --appendonly, 'yes']
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/temporal:latest
    command: [server, start-dev, --ip, 0.0.0.0, --db-filename, /home/temporal/temporal.db]
    restart: unless-stopped
    volumes:
      - temporal-data:/home/temporal
    ports:
      - '127.0.0.1:7233:7233'
      - '127.0.0.1:8233:8233'
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, localhost:7233]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    <<: *app
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *app
    command: [node, dist/worker.js]
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  redis-data:
  temporal-data:
